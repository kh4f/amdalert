[package]
name = "amdlert"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.62.2", features = [
	"Win32_Foundation",
	"Win32_UI_WindowsAndMessaging",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_System_LibraryLoader",
	"Win32_System_Memory",
	"Win32_System_Threading",
	"Win32_Storage_FileSystem",
	"Win32_Security",
	"Win32_System_IO",
	"Win32_System_Pipes",
	"Win32_System_Registry",
] }

[build-dependencies]
cc = "1.4.0"