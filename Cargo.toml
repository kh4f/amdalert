[package]
name = "amdlert"
version = "3.0.2"
edition = "2024"

[dependencies]
windows = { version = "0.62", features = [
	"Win32_Foundation",
	"Win32_UI_WindowsAndMessaging",
	"Win32_Storage_FileSystem",
	"Win32_System_Pipes",
	"Win32_Security",
	"Win32_System_IO",
	"Win32_System_Registry",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
winresource = "0.1"
