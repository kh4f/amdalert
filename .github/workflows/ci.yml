name: CI

on: { push: { branches-ignore: wip/** } }

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with: { go-version: 1.26.0 }

      - name: Build
        run: go run build.go --build