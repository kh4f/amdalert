name: checks

on: { push: { branches: '**' } }

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: extractions/setup-just@v4

      - run: just lint
      - run: just build